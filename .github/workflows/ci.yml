name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentmesh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentmesh_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test (db-backed packages, serialized)
        # -p 1, scoped to only the packages that actually call db.New() at
        # TestMain/test-setup time: that call runs golang-migrate's Up()
        # against this one shared service-container Postgres, and multiple
        # package binaries hitting that migrate step concurrently can
        # deadlock on golang-migrate's own pg_advisory_lock (SQLSTATE
        # 40P01) -- confirmed non-deterministic by observing the same
        # signature fail on unrelated master/feature branch runs, always
        # inside a different package's migration bootstrap. -p 1 runs these
        # package binaries one at a time, serializing every db.New() call
        # and removing the race outright. Scoped rather than applied to
        # `./...` so packages with no DB dependency still run in parallel
        # below, instead of paying this serialization cost for no reason.
        run: go test -p 1 ./internal/api/handlers/... ./internal/db/... ./internal/engine/... ./internal/scheduler/...

      - name: go test (remaining packages, parallel)
        run: go test $(go list ./... | grep -vE '/internal/(api/handlers|db|engine|scheduler)(/|$)')

  frontend:
    name: frontend / lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      # Vercel auto-detects pnpm-lock.yaml and builds from it, while CI/local
      # dev use npm (package-lock.json) -- npm ci above only ever validates
      # the latter. This step catches the case where package.json moved but
      # pnpm-lock.yaml didn't (exactly what broke the Vercel build after the
      # PR #118 merge): regenerate it and fail if that produces a diff.
      # Pinned to a commit SHA, not a mutable @v4 tag -- same convention as
      # android.yml's action-gh-release pin.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - name: verify pnpm-lock.yaml is in sync with package.json
        run: |
          pnpm install --lockfile-only
          if ! git diff --exit-code pnpm-lock.yaml; then
            echo "::error::pnpm-lock.yaml is out of sync with package.json. Run 'pnpm install --lockfile-only' in frontend/ and commit the result." >&2
            exit 1
          fi

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
        run: npm run build
