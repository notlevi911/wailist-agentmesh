name: Android

# Deliberately NOT on push. The web app auto-deploys on merge; an Android
# build cannot, because every artefact that leaves here is signed with a real
# release key and lands in front of Play's review. So this is gated on an
# explicit release tag or a manual dispatch.
on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: android / signed bundle
    runs-on: ubuntu-latest
    # No contents: write here -- this job handles the keystore secrets, and
    # the third-party release action runs in a separate job below instead
    # of sharing this filesystem/env, on the principle that a step trusted
    # with repo-write shouldn't also share a runner with the signing key.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          # @capacitor/cli 8.x hard-requires Node >=22 (cap sync refuses to
          # run otherwise) -- bumped alongside the Capacitor 7->8 upgrade.
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # capacitor.build.gradle is regenerated by `cap sync` from whatever
          # @capacitor/android is installed (7.6.9 as of this writing), which
          # now emits sourceCompatibility/targetCompatibility VERSION_21 --
          # bump this alongside any future Capacitor major that raises it
          # further.
          java-version: 21

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install shell dependencies
        working-directory: mobile
        run: npm ci

      # Builds the static export, copies it into mobile/www, and runs
      # `cap sync android`. The API URL is baked in at build time -- there is
      # no server behind the bundle to configure it later.
      - name: Build the web bundle and sync
        working-directory: mobile
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.MOBILE_API_URL }}
        run: npm run sync

      # The keystore never exists in the repo. It is a base64 secret,
      # materialised for this job only and removed with the runner.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; cannot produce a signed bundle." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > mobile/android/release.keystore

      - name: Build the release bundle and APK
        working-directory: mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # bundleRelease (.aab) is what Play wants; assembleRelease (.apk) is
        # what a sideload install wants. Same signing config, both cheap off
        # one already-configured keystore, so build both every run.
        run: ./gradlew bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: agentmesh-release-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          # Signed and installable: it does not want a long shelf life in
          # CI storage.
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: agentmesh-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 7

      # Uploading to Play is intentionally NOT automated here. Background
      # location gets a manual review, and a release should be a decision
      # somebody makes, not a side effect of pushing a tag. Take the .aab
      # artefact above to the internal-testing track by hand.

  release:
    name: android / attach APK to release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    # Only this job gets contents: write, and only for the release step --
    # it never touches the keystore or any other secret, so a compromised
    # or malicious third-party action here has no signing key to reach for.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: agentmesh-release-apk
          path: apk

      # Release is titled "agentmesh <version>" (tag minus the android-v
      # prefix), not the raw tag -- android-v0.0.1 reads as an internal ref,
      # not a release name. Anything still on a 0.x version is pre-beta by
      # convention, so it's flagged prerelease automatically; drop the 0.
      # prefix once there's a real 1.0.0 to cut.
      - name: Compute the release name and prerelease flag
        id: relname
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          echo "name=agentmesh $version" >> "$GITHUB_OUTPUT"
          case "$version" in
            0.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # The .apk, unlike the .aab, needs no store review to matter -- it's
      # a real signed installable, so a tag push attaches it directly to a
      # GitHub Release for sideload distribution (demo builds, testers
      # without a Play internal-testing slot).
      - name: Attach the signed APK to a GitHub Release
        # Pinned to a commit SHA (v2.6.2), not a mutable @v2 tag -- this
        # step holds contents: write, so a tag it trusts blindly is a
        # supply-chain foothold. Bump via Dependabot / by hand, not by
        # re-floating @v2.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: apk/*.apk
          name: ${{ steps.relname.outputs.name }}
          prerelease: ${{ steps.relname.outputs.prerelease }}
          # The tag itself already went through review before being pushed
          # (see the "gated on an explicit release tag" note above); no
          # extra approval step belongs here.
          draft: false
          generate_release_notes: true
